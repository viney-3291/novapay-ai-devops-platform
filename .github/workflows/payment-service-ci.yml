name: Payment Service CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "apps/payment-service/**"
      - ".github/workflows/payment-service-ci.yml"

  push:
    branches:
      - feature/**
    paths:
      - "apps/payment-service/**"
      - ".github/workflows/payment-service-ci.yml"

permissions:
  contents: read

jobs:

  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/payment-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: |
          python -m pytest -v


  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Payment Service image
        run: |
          docker build \
            -t novapay-payment-service:${{ github.sha }} \
            apps/payment-service

      - name: Save Docker image
        run: |
          docker save \
            novapay-payment-service:${{ github.sha             nov  -o /tmp/      y-            ice.tar

      - name: Upload image f      - namescan
                                                      
          name: payment-service-image
          path: /tmp/novapay-payment-service.tar
          retention-days: 1


  security-scan:
    name: Container Security Scan
    runs-on: ubuntu-latest
    needs: docker-build

    steps:
      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: payment-service-image
          path: /tmp

      - name: Load Docker image
        run: |
          docker load -i /tmp/novapay-payment-service.tar

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "novapay-payment-service:${{ github.sha }}"
                                                            "
                                   ignore-unfixed: true
