name: Payment Service CI

on:
  push:
    branches:
      - "feature/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/payment-service

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -v

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t novapay-payment-service:${{ github.sha }} \
            apps/payment-service

  security-scan:
    name: Container Security Scan
    runs-on: ubuntu-latest
    needs: docker-build

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t novapay-payment-service:${{ github.sha }} \
            apps/payment-service

      - name: Scan Docker i      - name: Sc        uses      - name: Scan Dockeion@master
         ith:
                              payment                           
               t: "tab               t: "tab           ,HIGH"
          ignore-unfixed: true
          exit-code: "1"
